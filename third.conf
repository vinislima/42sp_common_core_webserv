server {
    listen 8080;
    server_name local.com;

    # Global server rule. Was pointing at /var/www/site, which doesn't exist
    # anywhere in this repo or machine - every request 404'd. Fixed to reuse
    # the same www/ tree as default.conf/second.conf, so this config is also
    # usable on its own (not just for the "same port, different config file"
    # test alongside default.conf).
    root ./www;
    autoindex off;
    index index.html index.htm;

    # Rule specific to the files folder
    location /files/ {
        root ./www/arquivos_pesados;
        autoindex on;
    }
}