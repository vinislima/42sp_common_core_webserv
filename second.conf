server {
	listen 8080;
	server_name local.com;
	client_max_body_size 20;
	# Regra Global do servidor
	root ./www;
	autoindex off;
	index index.html;

	# Restricts the root to GET only. Without a location here, DELETE/POST
	# at "/" would fall through with no method check at all - mirrors the
	# same fix already applied to default.conf.
	location / {
		allow_methods GET;
	}

	# Regra Exclusiva para a pasta de arquivos
	location /files/ {
		root ./www/arquivos_pesados;
		autoindex on;
	}
}

server {
	listen 8080;
	server_name meuteste.com;
	root ./www/teste_host;
	autoindex off;
	index index.html;
}
